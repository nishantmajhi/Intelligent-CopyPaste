<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Intelligent Copy Paste</title>
    <style>
      :root {
        --aero-blue-top: #eaf4fd;
        --aero-blue-mid: #bcdcf7;
        --aero-blue-deep: #3d94d9;
        --aero-titlebar-1: rgba(190, 222, 247, 0.85);
        --aero-titlebar-2: rgba(120, 178, 224, 0.55);
        --aero-border: rgba(255, 255, 255, 0.6);
        --aero-glow: #5fb2ee;
        --aero-close-red: #e9645b;
        --text-dark: #1c2b36;
        --text-mid: #3a4c58;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          "Segoe UI", "Segoe UI Variable", Tahoma, Verdana, sans-serif;
        background: #0b2036;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* ===== Rendered desktop wallpaper (so the glass blur has something to show) ===== */
      .wallpaper {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            circle at 78% 18%,
            #fff7d6 0%,
            #ffe9a3 6%,
            rgba(255, 233, 163, 0) 16%
          ),
          linear-gradient(
            180deg,
            #bfe4ff 0%,
            #7fc3ef 28%,
            #3f97d6 55%,
            #1f6aa8 78%,
            #0d3a63 100%
          );
      }
      .wallpaper .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        filter: blur(2px);
      }
      .wallpaper .ridge {
        position: absolute;
        left: -5%;
        right: -5%;
        height: 38%;
      }
      .ridge.back {
        bottom: 14%;
        background: #2c6f9e;
        clip-path: polygon(
          0% 60%,
          8% 40%,
          18% 55%,
          30% 25%,
          42% 50%,
          55% 20%,
          68% 48%,
          80% 30%,
          92% 52%,
          100% 38%,
          100% 100%,
          0% 100%
        );
        opacity: 0.85;
      }
      .ridge.mid {
        bottom: 6%;
        background: #1c4f78;
        clip-path: polygon(
          0% 70%,
          10% 45%,
          22% 62%,
          35% 30%,
          48% 58%,
          60% 28%,
          74% 55%,
          88% 35%,
          100% 60%,
          100% 100%,
          0% 100%
        );
        opacity: 0.92;
      }
      .ridge.front {
        bottom: 0%;
        height: 22%;
        background: linear-gradient(180deg, #123a5c, #0c2740);
        clip-path: polygon(
          0% 55%,
          14% 30%,
          26% 48%,
          40% 15%,
          52% 42%,
          66% 18%,
          80% 40%,
          92% 22%,
          100% 45%,
          100% 100%,
          0% 100%
        );
      }
      .wallpaper .sun-glow {
        position: absolute;
        top: 6%;
        right: 14%;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fffef2 0%,
          #ffe9a3 35%,
          rgba(255, 233, 163, 0) 70%
        );
        box-shadow: 0 0 90px 30px rgba(255, 238, 170, 0.35);
      }
      .wallpaper .lake-shimmer {
        position: absolute;
        bottom: 2%;
        left: 0;
        right: 0;
        height: 6%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0)
        );
      }

      .desktop-hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        letter-spacing: 0.3px;
      }

      /* ===== The Window ===== */
      .win {
        --hue: 207;
        --glass-opacity: 0.25;
        width: 260px;
        aspect-ratio: 1/1;
        display: flex;
        flex-direction: column;
        position: relative;
        isolation: isolate;
        border-radius: 8px;
        user-select: none;
        animation: pop-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      /* Colored glass sheet: diagonal reflection streak + top specular + tint */
      .win::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 8px;
        background:
          linear-gradient(
            104deg,
            transparent 26%,
            rgba(255, 255, 255, 0.32) 42%,
            rgba(255, 255, 255, 0.05) 50%,
            transparent 64%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.68),
            rgba(255, 255, 255, 0.2) 42%,
            rgba(255, 255, 255, 0) 54%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.12),
            rgba(0, 0, 0, 0.12)
          ),
          hsl(var(--hue) 65% 52% / var(--glass-opacity));
      }
      /* Frost layer: this is what actually blurs the wallpaper behind it */
      .win::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        border-radius: 8px;
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
      }
      @keyframes pop-in {
        from {
          transform: scale(0.92);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .win.minimized .recent-box {
        display: none;
      }
      .win.minimized {
        aspect-ratio: auto;
        flex: none;
      }

      .win-inner {
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- Title bar ---- */
      .titlebar {
        height: 32px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 6px 0 10px;
        cursor: grab;
        background: repeating-linear-gradient(
          108deg,
          rgba(255, 255, 255, 0.08) 0 1px,
          transparent 1px 5px
        );
        border-bottom: 1px solid rgba(0, 0, 0, 0.22);
        position: relative;
      }
      .titlebar:active {
        cursor: grabbing;
      }
      .titlebar-icon {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border-radius: 4px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .titlebar-icon img {
        width: 18px;
        height: 18px;
      }
      .titlebar-title {
        font-size: 12.5px;
        font-weight: 600;
        color: #0b1420;
        text-shadow:
          0 0 4px #fff,
          0 0 4px #fff,
          0 0 7px #fff,
          0 0 10px #fff;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---- Caption buttons: capsule hanging like real Aero min/close ---- */
      .titlebar-btns {
        display: flex;
        border: 1px solid rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        overflow: hidden;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9),
          1px 0 0 rgba(255, 255, 255, 0.7),
          -1px 0 0 rgba(255, 255, 255, 0.7);
      }
      .tbtn {
        min-width: 29px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(0, 0, 0, 0.28);
        color: rgba(0, 0, 0, 0.68);
        cursor: pointer;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.28) 46%,
          rgba(0, 0, 0, 0.08) 50%,
          rgba(0, 0, 0, 0.08) 78%,
          rgba(255, 255, 255, 0.4)
        );
        transition:
          box-shadow 0.12s ease,
          background 0.12s ease,
          color 0.12s ease;
      }
      .tbtn:last-child {
        border-right: 0;
        min-width: 34px;
      }
      .tbtn svg {
        width: 10px;
        height: 10px;
        display: block;
        stroke: currentColor;
      }
      .tbtn:not(.close):hover {
        color: #fff;
        background:
          radial-gradient(120% 90% at 50% 130%, #3fd0e6, transparent 60%),
          linear-gradient(180deg, #c3e3f4 48%, #1f79b0 50%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.9),
          0 0 8px 2px rgba(93, 196, 240, 0.85);
      }
      .tbtn:not(.close):active {
        background:
          radial-gradient(120% 90% at 50% 130%, #12e6e6, transparent 60%),
          linear-gradient(180deg, #8fb3c9 48%, #0d3350 50%);
      }
      .tbtn.close {
        color: #fff;
        background:
          radial-gradient(
            circle at -30% 50%,
            rgba(0, 0, 0, 0.4) 6%,
            transparent 55%
          ),
          radial-gradient(
            circle at 130% 50%,
            rgba(0, 0, 0, 0.4) 6%,
            transparent 55%
          ),
          linear-gradient(180deg, #e6a99f, #d16b5b 48%, #cf4b34 50%, #d8654c);
      }
      .tbtn.close:hover {
        background:
          radial-gradient(120% 90% at 50% 130%, #ff9a86, transparent 60%),
          linear-gradient(180deg, #ffc0b5 48%, #d40a0a 50%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.9),
          0 0 8px 2px rgba(255, 80, 48, 0.85);
      }
      .tbtn.close:active {
        background:
          radial-gradient(120% 90% at 50% 130%, #ff3a1a, transparent 60%),
          linear-gradient(180deg, #c94a3a 48%, #8b0000 50%);
      }

      /* ---- Body ---- */
      .win-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        background: linear-gradient(
          180deg,
          rgba(240, 246, 252, 0.55),
          rgba(225, 238, 248, 0.4)
        );
      }

      .recent-box {
        flex: 1;
        min-height: 0;
        border-radius: 8px;
        padding: 9px 11px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0.18)
        );
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.6) inset,
          0 1px 4px rgba(0, 0, 0, 0.15);
      }
      .recent-label {
        font-size: 11px;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: rgba(10, 24, 38, 0.85);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        margin-bottom: 4px;
        flex-shrink: 0;
      }
      .recent-text {
        font-size: 12px;
        color: #0d1c28;
        line-height: 1.4;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 20;
        -webkit-box-orient: vertical;
        word-break: break-word;
        transition: opacity 0.15s ease;
      }
      .recent-text.placeholder {
        color: rgba(15, 30, 45, 0.72);
      }
      .recent-text.pulse {
        animation: recent-pulse 0.4s ease;
      }
      @keyframes recent-pulse {
        0% {
          opacity: 0.2;
          transform: translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-row {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .aero-btn {
        flex: 0 0 auto;
        width: 104px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 6px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.12) 48%,
          rgba(255, 255, 255, 0.28) 52%,
          rgba(200, 230, 250, 0.35) 100%
        );
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.7) inset,
          0 1px 3px rgba(0, 0, 0, 0.25),
          0 0 0 rgba(95, 178, 238, 0);
        transition:
          box-shadow 0.15s ease,
          transform 0.05s ease,
          background 0.15s ease;
        color: var(--text-dark);
        font-size: 12.5px;
        font-weight: 600;
      }
      .aero-btn::before {
        /* top glass sheen band */
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 46%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.85),
          rgba(255, 255, 255, 0)
        );
        border-radius: 7px 7px 40% 40%/7px 7px 12px 12px;
        pointer-events: none;
      }
      .aero-btn:hover {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.8) inset,
          0 1px 3px rgba(0, 0, 0, 0.25),
          0 0 12px var(--aero-glow);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.65) 0%,
          rgba(225, 244, 255, 0.25) 48%,
          rgba(210, 238, 255, 0.4) 52%,
          rgba(180, 222, 248, 0.45) 100%
        );
      }
      .aero-btn:active {
        transform: translateY(1px) scale(0.985);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.3) inset,
          0 0 10px var(--aero-glow);
      }
      .aero-btn.flash {
        animation: flash-glow 0.5s ease;
      }
      @keyframes flash-glow {
        0% {
          box-shadow:
            0 0 0 rgba(95, 178, 238, 0) inset,
            0 0 22px var(--aero-glow);
        }
        100% {
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.7) inset,
            0 1px 3px rgba(0, 0, 0, 0.25),
            0 0 0 rgba(95, 178, 238, 0);
        }
      }

      .aero-btn .icon {
        width: 18px;
        height: 18px;
        position: relative;
        z-index: 1;
        flex-shrink: 0;
      }
      .aero-btn .label {
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      .aero-btn .hint {
        position: relative;
        z-index: 1;
        font-size: 9.5px;
        font-weight: 400;
        color: var(--text-mid);
        letter-spacing: 0.2px;
      }

      .win {
        z-index: 2;
      }
      .desktop-hint {
        z-index: 2;
      }

      /* taskbar mock, purely to sell the W7 vibe */
      .taskbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40px;
        background: linear-gradient(
          180deg,
          rgba(40, 80, 120, 0.85),
          rgba(15, 35, 55, 0.95)
        );
        border-top: 1px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        padding: 0 10px;
        backdrop-filter: blur(6px);
        z-index: 3;
      }
      .start-orb {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #8fe270,
          #2f8f2f 60%,
          #1c5e1c
        );
        box-shadow:
          0 0 10px rgba(120, 220, 120, 0.6),
          inset 0 0 4px rgba(255, 255, 255, 0.5);
        flex-shrink: 0;
      }
      .taskbar-spacer {
        flex: 1;
      }
      .tray {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 100%;
        border-left: 1px solid rgba(255, 255, 255, 0.15);
      }
      .tray-icon {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition:
          box-shadow 0.2s ease,
          background 0.2s ease;
        position: relative;
      }
      .tray-icon svg {
        width: 13px;
        height: 13px;
      }
      .tray-icon.hidden-app {
        box-shadow: 0 0 10px 2px rgba(95, 178, 238, 0.85);
        background: linear-gradient(
          180deg,
          rgba(150, 210, 255, 0.4),
          rgba(90, 170, 230, 0.2)
        );
        animation: tray-pulse 1.6s ease-in-out infinite;
      }
      @keyframes tray-pulse {
        0%,
        100% {
          box-shadow: 0 0 8px 1px rgba(95, 178, 238, 0.6);
        }
        50% {
          box-shadow: 0 0 14px 4px rgba(95, 178, 238, 0.95);
        }
      }
      .tray-tip {
        position: absolute;
        bottom: 34px;
        right: 0;
        background: rgba(20, 40, 60, 0.9);
        color: #fff;
        font-size: 10.5px;
        padding: 4px 8px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .tray-icon:hover .tray-tip {
        opacity: 1;
        transform: translateY(0);
      }
      .clock {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11.5px;
        padding-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wallpaper">
      <div class="sun-glow"></div>
      <div
        class="cloud"
        style="width: 110px; height: 34px; top: 12%; left: 12%"
      ></div>
      <div
        class="cloud"
        style="width: 70px; height: 24px; top: 18%; left: 22%"
      ></div>
      <div
        class="cloud"
        style="width: 90px; height: 28px; top: 9%; left: 55%"
      ></div>
      <div class="ridge back"></div>
      <div class="ridge mid"></div>
      <div class="ridge front"></div>
      <div class="lake-shimmer"></div>
    </div>

    <div class="win" id="win">
      <div class="win-inner">
        <div class="titlebar" id="titlebar">
          <div class="titlebar-icon">
            <img src="appicon.ico" />
          </div>
          <div class="titlebar-title">Intelligent Copy Paste</div>
          <div class="titlebar-btns">
            <div class="tbtn min" id="minBtn" title="Minimize">
              <svg viewBox="0 0 10 10">
                <line x1="1" y1="8" x2="9" y2="8" stroke-width="1.4" />
              </svg>
            </div>
            <div class="tbtn close" id="closeBtn" title="Close">
              <svg viewBox="0 0 10 10">
                <line x1="1" y1="1" x2="9" y2="9" stroke-width="1.4" />
                <line x1="9" y1="1" x2="1" y2="9" stroke-width="1.4" />
              </svg>
            </div>
          </div>
        </div>

        <div class="win-body">
          <div class="recent-box" id="recentBox">
            <div class="recent-label">Recently copied</div>
            <div class="recent-text placeholder" id="recentText">
              Nothing copied yet
            </div>
          </div>
          <div class="btn-row">
            <div class="aero-btn" id="copyBtn">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1c2b36"
                stroke-width="1.6"
              >
                <rect x="8" y="8" width="11" height="13" rx="1.5" />
                <path
                  d="M5 16H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v1"
                />
              </svg>
              <span class="label">Copy</span>
            </div>
            <div class="aero-btn" id="pasteBtn">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1c2b36"
                stroke-width="1.6"
              >
                <rect x="6" y="4" width="12" height="17" rx="1.5" />
                <rect x="9" y="2" width="6" height="3" rx="1" />
                <line x1="9" y1="11" x2="15" y2="11" />
                <line x1="9" y1="14.5" x2="15" y2="14.5" />
              </svg>
              <span class="label">Paste</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="desktop-hint">
      Mockup only — buttons simulate the action · closing sends it to the tray,
      not quits
    </div>

    <div class="taskbar">
      <div class="start-orb"></div>
      <div class="taskbar-spacer"></div>
      <div class="tray">
        <div class="tray-icon" id="trayIcon" title="">
          <img src="appicon.ico" />
          <div class="tray-tip" id="trayTip">
            Intelligent Copy Paste is running
          </div>
        </div>
        <div class="clock">10:47 AM</div>
      </div>
    </div>

    <script>
      // --- Drag the window around like a real one ---
      const win = document.getElementById("win");
      const titlebar = document.getElementById("titlebar");
      let dragging = false,
        offX = 0,
        offY = 0;

      titlebar.addEventListener("mousedown", (e) => {
        if (e.target.closest(".tbtn")) return;
        dragging = true;
        const r = win.getBoundingClientRect();
        offX = e.clientX - r.left;
        offY = e.clientY - r.top;
        win.style.position = "fixed";
        win.style.left = r.left + "px";
        win.style.top = r.top + "px";
        win.style.margin = 0;
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        win.style.left = e.clientX - offX + "px";
        win.style.top = e.clientY - offY + "px";
      });
      window.addEventListener("mouseup", () => (dragging = false));

      // --- Minimize / close mock behavior ---
      document.getElementById("minBtn").addEventListener("click", () => {
        win.classList.toggle("minimized");
      });
      const trayIcon = document.getElementById("trayIcon");
      const trayTip = document.getElementById("trayTip");

      document.getElementById("closeBtn").addEventListener("click", () => {
        win.style.transition = "opacity .18s ease, transform .18s ease";
        win.style.opacity = 0;
        win.style.transform = "scale(.88)";
        win.style.pointerEvents = "none";
        trayIcon.classList.add("hidden-app");
        trayTip.textContent = "Intelligent Copy Paste — click to reopen";
      });

      trayIcon.addEventListener("click", () => {
        if (!trayIcon.classList.contains("hidden-app")) return;
        trayIcon.classList.remove("hidden-app");
        trayTip.textContent = "Intelligent Copy Paste is running";
        win.style.pointerEvents = "auto";
        win.style.opacity = 1;
        win.style.transform = "scale(1)";
      });

      // --- Copy / Paste simulated action ---
      function flashAction(btn, text) {
        btn.classList.remove("flash");
        void btn.offsetWidth; // restart animation
        btn.classList.add("flash");
      }
      const sampleSnippets = [
        "Q3 revenue grew 12% year over year, driven mainly by the EMEA region. The board wants a deeper breakdown of the EMEA contribution before the next quarterly review, including a country by country split and the currency effects that influenced the final reported figure.",
        "ssh ubuntu@10.0.4.21 -p 2222",
        "Please review the attached proposal before Friday's sync.",
        "4f2a-91d0-6c3b-plaintext-demo-key",
      ];
      let snippetIndex = 0;
      const recentText = document.getElementById("recentText");

      function updateTextClamp() {
        const lineHeight =
          parseFloat(getComputedStyle(recentText).lineHeight) || 16.8;
        const maxLines = Math.max(
          1,
          Math.floor(recentText.clientHeight / lineHeight),
        );
        recentText.style.webkitLineClamp = String(maxLines);
      }
      window.addEventListener("resize", updateTextClamp);
      updateTextClamp();

      document.getElementById("copyBtn").addEventListener("click", function () {
        flashAction(this, "Ctrl+C sent — copied");
        recentText.textContent =
          sampleSnippets[snippetIndex % sampleSnippets.length];
        snippetIndex++;
        recentText.classList.remove("placeholder");
        recentText.classList.remove("pulse");
        void recentText.offsetWidth;
        recentText.classList.add("pulse");
        updateTextClamp();
      });
      document
        .getElementById("pasteBtn")
        .addEventListener("click", function () {
          // Paste always uses the plain-text chord, regardless of focus.
          flashAction(this, "Ctrl+Shift+V sent — pasted");
        });
    </script>
  </body>
</html>
